name: Deploy Website

# Builds the 11ty site and — only when a human asks for it — publishes
# cuecard-website/_site to GitHub Pages.
#
# Pushing NEVER publishes. A push to main (or a PR) runs the build and the
# verification step as CI, so a broken site is caught immediately, but it stops
# there. Publishing to cuecard.dev is an explicit action: open Actions →
# "Deploy Website" → "Run workflow", which is the only event that reaches the
# deploy job.
#
# The site is fully static: there is no PHP and no .htaccess, so Pages serves
# 404.html natively and the /ios and /android shortlinks are generated as
# meta-refresh pages from src/_data/shortlinks.json. src/CNAME pins the
# custom domain — deleting it reverts cuecard.dev to the github.io host.

on:
  push:
    branches: [main]
    paths:
      - 'cuecard-website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    paths:
      - 'cuecard-website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built site to GitHub Pages (cuecard.dev)'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit supersede an in-flight deploy, but never cancel one
# midway — a half-applied Pages deploy would leave the site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cuecard-website/package-lock.json

      - name: Install dependencies
        working-directory: cuecard-website
        run: npm ci

      - name: Build site
        working-directory: cuecard-website
        run: npm run build

      - name: Verify build output
        working-directory: cuecard-website
        run: |
          set -euo pipefail
          # A silently-empty build would publish a blank site over a working one.
          for f in _site/index.html _site/404.html _site/CNAME \
                   _site/ios/index.html _site/android/index.html; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
          done
          # The site is served by GitHub Pages, which runs no PHP.
          if find _site -name '*.php' | grep -q .; then
            echo "::error::PHP files cannot be served by GitHub Pages"
            exit 1
          fi

      # Everything below only runs for a manual, opted-in dispatch. On a push
      # the workflow ends here, having proved the site still builds.
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: cuecard-website/_site

  deploy:
    # Publishing is deliberate: only a manual run of this workflow with the
    # publish input left on can reach GitHub Pages.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
